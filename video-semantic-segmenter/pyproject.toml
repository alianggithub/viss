[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-semantic-segmenter"
version = "0.1.0"
description = "Transcript-first multimodal semantic segmentation for local videos"
requires-python = ">=3.11"
dependencies = [
  "av>=18,<19",
  "numpy>=2,<3",
  "Pillow>=12,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2"]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.23,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
all = [
  "faster-whisper>=1.2,<2",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.23,<2",
]

[project.scripts]
vseg = "vseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
